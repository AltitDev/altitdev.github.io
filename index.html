<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altit | Precision Operational Tools</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #090d16;
            color: #f3f4f6;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 12px;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #9ca3af;
            line-height: 1.6;
        }
        .badge {
            background-color: #1e1b4b;
            color: #a78bfa;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 24px;
            border: 1px solid #4c1d95;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Altit Workflows</div>
        <h1>Altit</h1>
        <p>We build highly focused, isolated software solutions that eliminate localized friction points for enterprise professionals. Our pinpoint tools automate micro-workflows, saving valuable engineering and operational hours every day.</p>
    </div>
</body>
</html>
